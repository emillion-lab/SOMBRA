name: Harden JSON parsing

# Llama понякога слага изречение около JSON-а. Един опит без прошка
# означава провален одит. Тук: до три опита и балансирано изваждане.
# Функцията се намира по сигнатура и се заменя чрез броене на скоби,
# за да не зависи от отстъпите.

on:
  push:
    paths: ['.github/workflows/harden-json.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace the llm helper
        run: |
          python3 - <<'PYEOF'
          path = 'src/index.js'
          s = open(path, encoding='utf-8').read()

          sig = 'async function llm(env, system, user) {'
          i = s.find(sig)
          assert i != -1, 'llm signature not found'
          if 'function carve' in s:
              print('already patched, nothing to do')
              raise SystemExit(0)

          # край на функцията чрез броене на скоби
          j = i + len(sig) - 1
          depth = 0
          end = None
          for k in range(j, len(s)):
              if s[k] == '{':
                  depth += 1
              elif s[k] == '}':
                  depth -= 1
                  if depth == 0:
                      end = k + 1
                      break
          assert end, 'closing brace not found'
          print('replacing chars', i, '..', end)

          new = r'''/* Extract the first balanced {...} object, ignoring braces inside strings. */
          function carve(text) {
            const t = String(text || '').replace(/```json|```/g, '');
            const start = t.indexOf('{');
            if (start < 0) return null;
            let depth = 0, inStr = false, esc = false;
            for (let i = start; i < t.length; i++) {
              const c = t[i];
              if (esc) { esc = false; continue; }
              if (c === '\\') { esc = true; continue; }
              if (c === '"') { inStr = !inStr; continue; }
              if (inStr) continue;
              if (c === '{') depth++;
              else if (c === '}') { depth--; if (depth === 0) return t.slice(start, i + 1); }
            }
            return null;
          }

          async function llm(env, system, user) {
            let lastErr = 'no attempt';
            for (let attempt = 0; attempt < 3; attempt++) {
              const nudge = attempt === 0 ? '' :
                '\n\nYour previous reply could not be parsed. Output the JSON object and nothing else: ' +
                'no greeting, no explanation, no code fence. Start with { and end with }.';
              try {
                const r = await env.AI.run(MODEL, {
                  messages: [
                    { role: 'system', content: system + ' Output raw JSON only.' },
                    { role: 'user', content: user + nudge },
                  ],
                  max_tokens: 1800,
                  temperature: attempt === 0 ? 0.1 : 0,
                });
                const body = carve(r.response);
                if (!body) { lastErr = 'no JSON object in reply'; continue; }
                return JSON.parse(body);
              } catch (e) {
                lastErr = e.message;
              }
            }
            throw new Error('Model did not return usable JSON after 3 attempts: ' + lastErr);
          }'''

          # махаме отстъпа, наследен от YAML блока
          new = '\n'.join(line[10:] if line.startswith(' ' * 10) else line
                          for line in new.split('\n'))

          s = s[:i] + new + s[end:]
          open(path, 'w', encoding='utf-8').write(s)
          print('patched, bytes now:', len(s))
          PYEOF

      - name: Syntax check
        run: |
          cp src/index.js /tmp/check.mjs
          node --check /tmp/check.mjs
          echo "syntax ok"
          echo "carve present: $(grep -c 'function carve' src/index.js)"
          echo "retry present: $(grep -c '3 attempts' src/index.js)"

      - name: Commit
        run: |
          git config user.name "ci"
          git config user.email "ci@emillion-lab"
          git add src/index.js
          git commit -m "retry and balanced extraction when the model wraps its JSON in prose" || true
          git push || true
