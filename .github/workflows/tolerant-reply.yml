name: Tolerant model reply

# "no JSON object in reply" и на трите опита значи, че отговорът идва
# празен или в друга форма, а не че моделът е разговорлив.
# Тук: изричен JSON режим на първия опит, четене в няколко възможни
# форми, и диагностика в грешката, за да не гадаем следващия път.

on:
  push:
    paths: ['.github/workflows/tolerant-reply.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace the llm helper
        run: |
          python3 - <<'PYEOF'
          path = 'src/index.js'
          s = open(path, encoding='utf-8').read()

          sig = 'async function llm(env, system, user) {'
          i = s.find(sig)
          assert i != -1, 'llm signature not found'

          j = i + len(sig) - 1
          depth, end = 0, None
          for k in range(j, len(s)):
              if s[k] == '{': depth += 1
              elif s[k] == '}':
                  depth -= 1
                  if depth == 0:
                      end = k + 1
                      break
          assert end, 'closing brace not found'

          new = r'''/* Workers AI has returned several shapes over time; accept all of them. */
          function textOf(r) {
            if (r == null) return '';
            if (typeof r === 'string') return r;
            if (typeof r.response === 'string') return r.response;
            if (r.response && typeof r.response === 'object') return JSON.stringify(r.response);
            const c = Array.isArray(r.choices) ? r.choices[0] : null;
            if (c) return (c.message && c.message.content) || c.text || '';
            if (r.result && typeof r.result.response === 'string') return r.result.response;
            if (typeof r.output_text === 'string') return r.output_text;
            return '';
          }

          function shapeOf(r) {
            try {
              return 'keys=' + Object.keys(r || {}).join('|') +
                     ' head=' + JSON.stringify(r).slice(0, 180);
            } catch (e) { return 'unserialisable reply'; }
          }

          async function llm(env, system, user) {
            let lastErr = 'no attempt';
            for (let attempt = 0; attempt < 3; attempt++) {
              const nudge = attempt === 0 ? '' :
                '\n\nYour previous reply could not be parsed. Output the JSON object and nothing else: ' +
                'no greeting, no explanation, no code fence. Start with { and end with }.';
              const opts = {
                messages: [
                  { role: 'system', content: system + ' Output raw JSON only.' },
                  { role: 'user', content: user + nudge },
                ],
                max_tokens: 1800,
                temperature: attempt === 0 ? 0.1 : 0,
              };
              // Първият опит иска изричен JSON режим; ако моделът не го
              // поддържа, следващите минават без него.
              if (attempt === 0) opts.response_format = { type: 'json_object' };

              try {
                const r = await env.AI.run(MODEL, opts);
                const raw = textOf(r);
                if (!raw) { lastErr = 'empty reply · ' + shapeOf(r); continue; }
                const body = carve(raw);
                if (!body) { lastErr = 'no JSON in: ' + raw.slice(0, 180); continue; }
                return JSON.parse(body);
              } catch (e) {
                lastErr = e.message;
              }
            }
            throw new Error('Model gave no usable JSON in 3 attempts. Last: ' + lastErr);
          }'''

          new = '\n'.join(line[10:] if line.startswith(' ' * 10) else line
                          for line in new.split('\n'))

          s = s[:i] + new + s[end:]
          open(path, 'w', encoding='utf-8').write(s)
          print('patched, bytes now:', len(s))
          PYEOF

      - name: Syntax check
        run: |
          cp src/index.js /tmp/check.mjs
          node --check /tmp/check.mjs
          echo "textOf: $(grep -c 'function textOf' src/index.js)"
          echo "shapeOf: $(grep -c 'function shapeOf' src/index.js)"
          echo "carve still present: $(grep -c 'function carve' src/index.js)"

      - name: Commit
        run: |
          git config user.name "ci"
          git config user.email "ci@emillion-lab"
          git add src/index.js
          git commit -m "accept several Workers AI reply shapes; report the shape when parsing fails" || true
          git push || true
